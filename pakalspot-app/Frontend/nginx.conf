server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    
    # Increase client body size for file uploads
    client_max_body_size 10M;

    # Proxy API requests to backend (^~ modifier gives priority over regex)
    location ^~ /api {
        # Handle trailing slash redirects
        rewrite ^/api/spots$ /api/spots/ last;
        rewrite ^/api/spots\?(.*)$ /api/spots/?$1 last;
        
        proxy_pass http://backend:8000/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static files (JS, CSS, images, etc.)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Serve env-config.js specifically
    location = /env-config.js {
        try_files $uri =404;
    }

    # Serve static files and fallback to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
