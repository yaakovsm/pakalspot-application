name: Deploy to Kubernetes

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Registry login (example DockerHub)
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      # Build & push frontend with Nginx
      - name: Build Frontend
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/pakalspot-frontend:nginx ./Frontend
      - name: Push Frontend
        run: docker push ${{ secrets.DOCKER_USERNAME }}/pakalspot-frontend:nginx

      # Build & push backend
      - name: Build Backend
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/pakalspot-backend:latest ./Backend
      - name: Push Backend
        run: docker push ${{ secrets.DOCKER_USERNAME }}/pakalspot-backend:latest

      # Configure kubectl
      - name: Setup kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          kubectl config use-context ${{ secrets.K8S_CONTEXT }}

      # Install Helm
      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      # Helm upgrade with runtime Maps key + backend secrets
      - name: Helm upgrade
        run: |
          helm upgrade --install ${{ secrets.HELM_RELEASE }} ./pakalspot-chart \
            -n ${{ secrets.K8S_NAMESPACE }} --create-namespace \
            -f ./pakalspot-chart/values.yaml \
            --set frontend.image.repository=${{ secrets.DOCKER_USERNAME }}/pakalspot-frontend \
            --set frontend.image.tag=nginx \
            --set backend.image.repository=${{ secrets.DOCKER_USERNAME }}/pakalspot-backend \
            --set backend.image.tag=latest \
            --set frontend.envRuntime.GOOGLE_MAPS_API_KEY="${{ secrets.GOOGLE_MAPS_API_KEY }}" \
            --set backend.secrets.S3_ACCESS_KEY_ID="${{ secrets.S3_ACCESS_KEY_ID }}" \
            --set backend.secrets.S3_SECRET_ACCESS_KEY="${{ secrets.S3_SECRET_ACCESS_KEY }}" \
            --set backend.secrets.S3_ENDPOINT="${{ secrets.S3_ENDPOINT }}"

      # Verify deployment
      - name: Verify deployment
        run: |
          kubectl -n ${{ secrets.K8S_NAMESPACE }} get pods,svc,ep
          kubectl -n ${{ secrets.K8S_NAMESPACE }} wait --for=condition=ready pod -l app.kubernetes.io/component=frontend --timeout=300s
          kubectl -n ${{ secrets.K8S_NAMESPACE }} wait --for=condition=ready pod -l app.kubernetes.io/component=backend --timeout=300s
