# Default values for pakalspot-chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
# All actual configuration values should be provided via GitOps values files

# Global configuration
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""
  image:
    tag: ""

# Application configuration
app:
  name: ""
  environment: ""
  namespace: ""

# Frontend configuration
frontend:
  enabled: true
  replicaCount: 1
  
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  
  resources: {}
  # limits:
  #   cpu: 200m
  #   memory: 256Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  
  livenessProbe: {}
  # httpGet:
  #   path: /
  #   port: 80
  # initialDelaySeconds: 30
  # periodSeconds: 10
  # timeoutSeconds: 5
  # failureThreshold: 3
  
  readinessProbe: {}
  # httpGet:
  #   path: /
  #   port: 80
  # initialDelaySeconds: 5
  # periodSeconds: 5
  # timeoutSeconds: 3
  # failureThreshold: 3
  
  startupProbe: {}
  # httpGet:
  #   path: /
  #   port: 80
  # initialDelaySeconds: 10
  # periodSeconds: 5
  # timeoutSeconds: 3
  # failureThreshold: 30
  
  env: {}
  envRuntime: {}
  podAnnotations: {}

# Backend configuration
backend:
  enabled: true
  replicaCount: 1
  
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000
  
  resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 250m
  #   memory: 256Mi
  
  livenessProbe: {}
  # httpGet:
  #   path: /docs
  #   port: 8000
  # initialDelaySeconds: 60
  # periodSeconds: 10
  # timeoutSeconds: 5
  # failureThreshold: 3
  
  readinessProbe: {}
  # httpGet:
  #   path: /docs
  #   port: 8000
  # initialDelaySeconds: 30
  # periodSeconds: 5
  # timeoutSeconds: 3
  # failureThreshold: 3
  
  startupProbe: {}
  # httpGet:
  #   path: /docs
  #   port: 8000
  # initialDelaySeconds: 10
  # periodSeconds: 5
  # timeoutSeconds: 3
  # failureThreshold: 30
  
  env: {}
  
  # Database migration and seeding
  initContainers:
    dbMigrate:
      enabled: false
      command: []
    dbSeed:
      enabled: false
      command: []
  
  podAnnotations: {}

# Database configuration (PostgreSQL with PostGIS)
database:
  enabled: true
  type: postgresql
  
  statefulSet:
    enabled: true
    replicaCount: 1
  
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 5432
    targetPort: 5432
  
  resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 1Gi
  # requests:
  #   cpu: 250m
  #   memory: 512Mi
  
  livenessProbe: {}
  # exec:
  #   command:
  #     - /bin/sh
  #     - -c
  #     - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -p 5432
  # initialDelaySeconds: 30
  # periodSeconds: 10
  # timeoutSeconds: 5
  # failureThreshold: 3
  
  readinessProbe: {}
  # exec:
  #   command:
  #     - /bin/sh
  #     - -c
  #     - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -p 5432
  # initialDelaySeconds: 5
  # periodSeconds: 5
  # timeoutSeconds: 3
  # failureThreshold: 3
  
  persistence:
    enabled: true
    size: ""
    storageClass: ""
    accessMode: ReadWriteOnce
  
  config:
    POSTGRES_DB: ""
    POSTGRES_PORT: ""
  
  securityContext: {}
  # runAsUser: 999
  # runAsGroup: 999
  # fsGroup: 999

# Secrets configuration
secrets:
  database:
    POSTGRES_USER: ""
    POSTGRES_PASSWORD: ""

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  # - host: chart-example.local
  #   paths:
  #     - path: /
  #       pathType: Prefix
  #       service: frontend
  tls:
    enabled: false
    secretName: ""
    hosts: []

# Service Account
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Pod Security Context
podSecurityContext: {}
# runAsNonRoot: true
# runAsUser: 1000
# runAsGroup: 1000
# fsGroup: 1000

# Container Security Context
securityContext: {}
# allowPrivilegeEscalation: false
# readOnlyRootFilesystem: false
# runAsNonRoot: true
# runAsUser: 1000
# capabilities:
#   drop:
#     - ALL

# Node selection
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Autoscaling configuration
autoscaling:
  enabled: false
  frontend:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
    behavior: {}
  backend:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
    behavior: {}

# Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  frontend:
    enabled: false
    minAvailable: ""
    maxUnavailable: ""
  backend:
    enabled: false
    minAvailable: ""
    maxUnavailable: ""

# Network Policy
networkPolicy:
  enabled: false
  policyTypes: []
  ingress: []
  egress: []

# Monitoring
monitoring:
  enabled: false
  prometheus:
    enabled: false
  grafana:
    enabled: false

# Resource Quotas (optional, namespace-level)
resourceQuota:
  enabled: false
  hard: {}
