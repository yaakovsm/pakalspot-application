# Global configuration
global:
  imageRegistry: ""
  image:
    tag: "dev-508b907"
  imagePullSecrets:
    - name: ghcr-pull
  storageClass: ""

# Application configuration
app:
  name: pakalspot
  environment: dev
  namespace: pakalspot

# Frontend configuration
frontend:
  enabled: true
  replicaCount: 1
  
  image:
    repository: yaakovsm/pakalspot-frontend
    tag: dev-508b907
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  
  livenessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  readinessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  
  env:
    VITE_HOST: "0.0.0.0"
    VITE_ALLOWED_HOSTS: "all"
    VITE_API_URL: "/api"
  envRuntime:
    VITE_GOOGLE_MAPS_API_KEY: ""

# Backend configuration
backend:
  enabled: true
  replicaCount: 1
  
  image:
    repository: yaakovsm/pakalspot-backend
    tag: dev-508b907
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  
  livenessProbe:
    httpGet:
      path: /docs
      port: 8000
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  readinessProbe:
    httpGet:
      path: /docs
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  
  env:
    JWT_EXPIRY: "43200"
    API_PREFIX: "/api"
    S3_BUCKET: "pakalspot-photos"
    DEBUG: "true"
    ENVIRONMENT: "development"
  # Secrets are now managed by CI/CD pipeline via pakalspot-secrets
  
  # Database migration and seeding
  initContainers:
    dbMigrate:
      enabled: true
      command: ["python", "-c", "from app.models import Base; from app.core.database import engine; Base.metadata.create_all(bind=engine); print('Database tables created successfully')"]
    
    dbSeed:
      enabled: true
      command: ["python", "/app/app/db/seed.py"]

# Database configuration (PostgreSQL with PostGIS)
database:
  enabled: true
  type: postgresql
  
  # Use StatefulSet for database
  statefulSet:
    enabled: true
    replicaCount: 1
  
  image:
    repository: postgis/postgis
    tag: "15-3.3"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 5432
    targetPort: 5432
  
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  
  livenessProbe:
    exec:
      command:
        - /bin/sh
        - -c
        - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -p 5432
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  readinessProbe:
    exec:
      command:
        - /bin/sh
        - -c
        - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -p 5432
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  
  # Persistent storage
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  
  # Database configuration
  config:
    POSTGRES_DB: "pakalspot_db"
    POSTGRES_PORT: "5432"
  
  # Security context for database
  securityContext:
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999

# Secrets configuration
# Backend secrets are now managed by CI/CD pipeline via pakalspot-secrets
# Database secrets remain in this chart for local development
secrets:
  database:
    POSTGRES_USER: "pakalspot_user"
    POSTGRES_PASSWORD: "jcoffeebrew"

# Ingress configuration
ingress:
  enabled: true
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  
  hosts:
    - host: pakalspot.local
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /media
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend
  
  tls:
    enabled: false
    secretName: pakalspot-tls

# Service Account
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Pod Security Context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Container Security Context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

# Node selection
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Monitoring (to be implemented later by student)
monitoring:
  enabled: false
  