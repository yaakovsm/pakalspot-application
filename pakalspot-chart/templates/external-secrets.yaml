apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.aws.region | default "us-east-1" }}
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
{{- if .Values.backend.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pakalspot-backend-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets
  target:
    name: pakalspot-backend-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /pakalspot/{{ .Values.app.environment }}/backend
{{- end }}
---
{{- if .Values.frontend.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pakalspot-frontend-env
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets
  target:
    name: pakalspot-frontend-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /pakalspot/{{ .Values.app.environment }}/frontend
{{- end }}







