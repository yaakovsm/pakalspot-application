apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            namespace: external-secrets
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-credentials
            namespace: external-secrets
            key: secret-access-key
---
{{- if .Values.backend.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pakalspot-backend-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets
  target:
    name: pakalspot-backend-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /pakalspot/{{ .Values.app.environment }}/backend
{{- end }}
---
{{- if .Values.frontend.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pakalspot-frontend-env
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets
  target:
    name: pakalspot-frontend-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /pakalspot/{{ .Values.app.environment }}/frontend
{{- end }}



