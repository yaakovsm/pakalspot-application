{{- if .Values.frontend.enabled }}
{{- if .Values.frontend.envRuntime }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pakalspot-chart.fullname" . }}-frontend-env-config
  labels:
    {{- include "pakalspot-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  env-config.js: |
    // Environment configuration for PakalSpot
    window.__ENV = {
    {{- range $key, $value := .Values.frontend.envRuntime }}
      {{ $key }}: {{ $value | quote }},
    {{- end }}
    };
{{- end }}
{{- end }}

