{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pakalspot-chart.fullname" . }}-nginx-config
  labels:
    {{- include "pakalspot-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  default.conf: |
    server {
      listen 80;
      root /usr/share/nginx/html;

      # Inject env-config.js before </head>
      sub_filter_once off;
      sub_filter '</head>' '<script src="/env-config.js"></script></head>';
      sub_filter_types text/html;

      location / {
        try_files $uri $uri/ /index.html;
      }

      location = /env-config.js {
        add_header Content-Type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /env-config.js =404;
      }
    }
{{- end }}
