{{- if .Values.backend.enabled }}
{{ include "noLatest" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pakalspot-chart.fullname" . }}-backend
  labels:
    {{- include "pakalspot-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "pakalspot-chart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "pakalspot-chart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      {{- with .Values.backend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pakalspot-chart.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.backend.initContainers.dbMigrate.enabled }}
      initContainers:
        - name: wait-for-db
          image: postgres:16
          command:
            - bash
            - -lc
            - |
              # Extract password from DB_URL for PGPASSWORD
              export PGPASSWORD=$(echo "$DB_URL" | sed -E 's|postgresql://[^:]+:([^@]+)@.*|\1|')
              # Use psql with DB_URL directly to check connectivity
              # Show errors to debug connection issues
              until psql "$DB_URL" -c "SELECT 1" 2>&1; do
                echo "waiting for database...";
                sleep 2;
              done
              echo "Database is ready!"
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: pakalspot-backend-secrets
                  key: DB_URL
        - name: db-migrate
          image: {{ include "pakalspot-chart.image" (dict "root" . "service" "backend") | quote }}
          imagePullPolicy: {{ include "pakalspot-chart.imagePullPolicy" (dict "root" . "service" "backend") }}
          command:
            {{- toYaml .Values.backend.initContainers.dbMigrate.command | nindent 12 }}
          env:
            {{- range $key, $value := .Values.backend.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: pakalspot-backend-secrets
            - secretRef:
                name: {{ include "pakalspot-chart.fullname" . }}-db-secrets
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
        {{- if .Values.backend.initContainers.dbSeed.enabled }}
        - name: db-seed
          image: {{ include "pakalspot-chart.image" (dict "root" . "service" "backend") | quote }}
          imagePullPolicy: {{ include "pakalspot-chart.imagePullPolicy" (dict "root" . "service" "backend") }}
          command:
            {{- toYaml .Values.backend.initContainers.dbSeed.command | nindent 12 }}
          env:
            {{- range $key, $value := .Values.backend.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: pakalspot-backend-secrets
            - secretRef:
                name: {{ include "pakalspot-chart.fullname" . }}-db-secrets
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
        {{- end }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "pakalspot-chart.image" (dict "root" . "service" "backend") | quote }}
          imagePullPolicy: {{ include "pakalspot-chart.imagePullPolicy" (dict "root" . "service" "backend") }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.targetPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.backend.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: pakalspot-backend-secrets
            - secretRef:
                name: {{ include "pakalspot-chart.fullname" . }}-db-secrets
          {{- with .Values.backend.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
