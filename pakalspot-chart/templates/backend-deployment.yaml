{{- if .Values.backend.enabled }}
{{ include "noLatest" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pakalspot-chart.fullname" . }}-backend
  labels:
    {{- include "pakalspot-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "pakalspot-chart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "pakalspot-chart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      {{- with .Values.backend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pakalspot-chart.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.backend.initContainers.dbMigrate.enabled }}
      initContainers:
        - name: wait-for-db
          image: postgres:16
          command:
            - bash
            - -lc
            - |
              set -e
              MAX_ATTEMPTS=60
              ATTEMPT=0
              SLEEP_INTERVAL=5
              
              echo "[$(date +'%Y-%m-%d %H:%M:%S')] Starting database connectivity check..."
              echo "[$(date +'%Y-%m-%d %H:%M:%S')] DB_URL format: ${DB_URL%%@*}@***"
              
              # Extract password from DB_URL for PGPASSWORD
              export PGPASSWORD=$(echo "$DB_URL" | sed -E 's|postgresql://[^:]+:([^@]+)@.*|\1|')
              
              while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
                ATTEMPT=$((ATTEMPT + 1))
                echo "[$(date +'%Y-%m-%d %H:%M:%S')] Attempt $ATTEMPT/$MAX_ATTEMPTS: Checking database connectivity..."
                
                if psql "$DB_URL" -c "SELECT 1" >/dev/null 2>&1; then
                  echo "[$(date +'%Y-%m-%d %H:%M:%S')] ✓ Database is ready!"
                  exit 0
                else
                  ERROR_MSG=$(psql "$DB_URL" -c "SELECT 1" 2>&1 || true)
                  echo "[$(date +'%Y-%m-%d %H:%M:%S')] ✗ Database not ready yet. Error: ${ERROR_MSG}"
                  
                  if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                    echo "[$(date +'%Y-%m-%d %H:%M:%S')] Waiting ${SLEEP_INTERVAL} seconds before next attempt..."
                    sleep $SLEEP_INTERVAL
                  fi
                fi
              done
              
              echo "[$(date +'%Y-%m-%d %H:%M:%S')] ✗ FATAL: Database connectivity check failed after $MAX_ATTEMPTS attempts ($((MAX_ATTEMPTS * SLEEP_INTERVAL)) seconds)"
              echo "[$(date +'%Y-%m-%d %H:%M:%S')] Please check:"
              echo "  - RDS instance is running and accessible"
              echo "  - Security groups allow traffic from EKS nodes"
              echo "  - DB_URL is correct and credentials are valid"
              echo "  - Network connectivity from cluster to RDS"
              exit 1
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: pakalspot-backend-secrets
                  key: DB_URL
          envFrom:
            - secretRef:
                name: pakalspot-backend-secrets
            {{- if .Values.database.enabled }}
            - secretRef:
                name: {{ include "pakalspot-chart.fullname" . }}-db-secrets
            {{- end }}

        - name: db-migrate
          image: {{ include "pakalspot-chart.image" (dict "root" . "service" "backend") | quote }}
          imagePullPolicy: {{ include "pakalspot-chart.imagePullPolicy" (dict "root" . "service" "backend") }}
          command:
            {{- toYaml .Values.backend.initContainers.dbMigrate.command | nindent 12 }}
          env:
            {{- range $key, $value := .Values.backend.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: pakalspot-backend-secrets
            {{- if .Values.database.enabled }}
            - secretRef:
                name: {{ include "pakalspot-chart.fullname" . }}-db-secrets
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
        {{- if .Values.backend.initContainers.dbSeed.enabled }}
        - name: db-seed
          image: {{ include "pakalspot-chart.image" (dict "root" . "service" "backend") | quote }}
          imagePullPolicy: {{ include "pakalspot-chart.imagePullPolicy" (dict "root" . "service" "backend") }}
          command:
            {{- toYaml .Values.backend.initContainers.dbSeed.command | nindent 12 }}
          env:
            {{- range $key, $value := .Values.backend.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: pakalspot-backend-secrets
            {{- if .Values.database.enabled }}
            - secretRef:
                name: {{ include "pakalspot-chart.fullname" . }}-db-secrets
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
        {{- end }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "pakalspot-chart.image" (dict "root" . "service" "backend") | quote }}
          imagePullPolicy: {{ include "pakalspot-chart.imagePullPolicy" (dict "root" . "service" "backend") }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.targetPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.backend.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: pakalspot-backend-secrets
            {{- if .Values.database.enabled }}
            - secretRef:
                name: {{ include "pakalspot-chart.fullname" . }}-db-secrets
            {{- end }}
          {{- with .Values.backend.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
