apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pakalspot-backend-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets
  target:
    name: pakalspot-backend-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /pakalspot/{{ .Values.app.environment }}/backend
