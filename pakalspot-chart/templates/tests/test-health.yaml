apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "pakalspot-chart.fullname" . }}-test-health"
  labels:
    {{- include "pakalspot-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: test-health
      image: curlimages/curl:7.85.0
      command: ['sh', '-c']
      args:
        - |
          set -e
          echo "Testing backend health endpoint..."
          curl -f http://{{ include "pakalspot-chart.fullname" . }}-backend:8000/api/health && echo "Backend health: OK" || echo "Backend health: FAILED"
          
          echo "Testing frontend health..."
          curl -f http://{{ include "pakalspot-chart.fullname" . }}-frontend:80/ && echo "Frontend health: OK" || echo "Frontend health: FAILED"
          
          echo "All health checks completed!"
