apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "pakalspot-chart.fullname" . }}-test-connection"
  labels:
    {{- include "pakalspot-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: test-connection
      image: busybox:1.35
      command: ['sh', '-c']
      args:
        - |
          set -e
          echo "Testing database connection..."
          nc -z {{ include "pakalspot-chart.fullname" . }}-postgres 5432 && echo "Database connection: OK" || echo "Database connection: FAILED"
          
          echo "Testing backend service..."
          nc -z {{ include "pakalspot-chart.fullname" . }}-backend 8000 && echo "Backend service: OK" || echo "Backend service: FAILED"
          
          echo "Testing frontend service..."
          nc -z {{ include "pakalspot-chart.fullname" . }}-frontend 5173 && echo "Frontend service: OK" || echo "Frontend service: FAILED"
          
          echo "All tests completed!"
