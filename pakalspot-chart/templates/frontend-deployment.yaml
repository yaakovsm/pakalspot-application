{{- if .Values.frontend.enabled }}
{{ include "noLatest" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pakalspot-chart.fullname" . }}-frontend
  labels:
    {{- include "pakalspot-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "pakalspot-chart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "pakalspot-chart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
      {{- with .Values.frontend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pakalspot-chart.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: generate-env-config
          image: busybox:1.35
          command: ["sh", "-c"]
          args:
            - |
              echo "window.__ENV = {" > /shared/env-config.js
              echo "  GOOGLE_MAPS_API_KEY: \"$GOOGLE_MAPS_API_KEY\"," >> /shared/env-config.js
              echo "  VITE_GOOGLE_MAPS_API_KEY: \"$GOOGLE_MAPS_API_KEY\"," >> /shared/env-config.js
              echo "  API_URL: \"/api\"" >> /shared/env-config.js
              echo "};" >> /shared/env-config.js
          env:
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pakalspot-frontend-env
                  key: GOOGLE_MAPS_API_KEY
          volumeMounts:
            - name: shared-env
              mountPath: /shared
      containers:
        - name: frontend
          image: {{ include "pakalspot-chart.image" (dict "root" . "service" "frontend") | quote }}
          imagePullPolicy: {{ include "pakalspot-chart.imagePullPolicy" (dict "root" . "service" "frontend") }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            {{- range $key, $value := .Values.frontend.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: pakalspot-frontend-env
          {{- with .Values.frontend.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.frontend.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.frontend.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.frontend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: shared-env
              mountPath: /usr/share/nginx/html/env-config.js
              subPath: env-config.js
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /run
      volumes:
        - name: shared-env
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: {{ include "pakalspot-chart.fullname" . }}-nginx-config
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
