{{ include "noLatest" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pakalspot-chart.fullname" . }}-frontend
  labels:
    {{- include "pakalspot-chart.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "pakalspot-chart.componentSelectorLabels" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pakalspot-chart.componentSelectorLabels" (dict "root" . "component" "frontend") | nindent 8 }}
      {{- with .Values.frontend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "pakalspot-chart.podSpec" . | nindent 6 }}
      initContainers:
        - name: generate-env-config
          image: busybox:1.35
          command: ["sh", "-c"]
          args:
            - |
              echo "window.__ENV = {" > /shared/env-config.js
              echo "  GOOGLE_MAPS_API_KEY: \"$GOOGLE_MAPS_API_KEY\"," >> /shared/env-config.js
              echo "  VITE_GOOGLE_MAPS_API_KEY: \"$GOOGLE_MAPS_API_KEY\"," >> /shared/env-config.js
              echo "  API_URL: \"/api\"" >> /shared/env-config.js
              echo "};" >> /shared/env-config.js
          env:
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pakalspot-frontend-env
                  key: GOOGLE_MAPS_API_KEY
          volumeMounts:
            - name: shared-env
              mountPath: /shared
      containers:
        - name: frontend
          image: {{ include "pakalspot-chart.image" (dict "root" . "service" "frontend") | quote }}
          imagePullPolicy: {{ include "pakalspot-chart.imagePullPolicy" (dict "root" . "service" "frontend") }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            {{- range $key, $value := .Values.frontend.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: pakalspot-frontend-env
          {{- with .Values.frontend.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.frontend.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.frontend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: shared-env
              mountPath: /usr/share/nginx/html/env-config.js
              subPath: env-config.js
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /run
      volumes:
        - name: shared-env
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: nginx-config
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
