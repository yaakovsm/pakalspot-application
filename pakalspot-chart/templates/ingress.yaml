apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pakalspot-chart.fullname" . }}-ing
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: pakalspot
    {{- if .Values.ingress.certificateArn }}
    # HTTPS configuration: Listen on both HTTP (80) and HTTPS (443)
    # Certificate ARN is provided from Terraform output via values.yaml
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.certificateArn | quote }}
    # Redirect HTTP traffic to HTTPS
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    {{- else }}
    # HTTP-only configuration (no certificate provided)
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    {{- end }}
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
spec:
  ingressClassName: alb
  rules:
    # כלל בסיסי – עובד בכל סביבה, בלי host
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "pakalspot-chart.fullname" . }}-frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "pakalspot-chart.fullname" . }}-backend
                port:
                  number: 80

    # חוקים מיוחדים לסביבות עם דומיין (אופציונלי)
    {{- if .Values.ingress.host }}
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "pakalspot-chart.fullname" . }}-frontend
                port:
                  number: 80
    {{- end }}

    {{- if .Values.ingress.apiHost }}
    - host: {{ .Values.ingress.apiHost }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "pakalspot-chart.fullname" . }}-backend
                port:
                  number: 80
    {{- end }}

    {{- if .Values.ingress.productionHost }}
    - host: {{ .Values.ingress.productionHost }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "pakalspot-chart.fullname" . }}-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "pakalspot-chart.fullname" . }}-frontend
                port:
                  number: 80
    {{- end }}
