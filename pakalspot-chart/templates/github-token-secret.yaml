# GitHub Token Secret for External Secrets Operator
# This secret must be created manually with a GitHub Personal Access Token
# that has access to repository secrets
#
# To create this secret manually:
# kubectl create secret generic github-secret-token \
#   --from-literal=token=<YOUR_GITHUB_TOKEN> \
#   --namespace=pakalspot-dev
#
# The GitHub token needs the following permissions:
# - repo (to access repository secrets)
# - read:org (if the repository is in an organization)

apiVersion: v1
kind: Secret
metadata:
  name: github-secret-token
  namespace: {{ .Values.app.namespace }}
  labels:
    {{- include "pakalspot-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: github-token
type: Opaque
stringData:
  # This will be overridden by the manually created secret
  token: "REPLACE_WITH_ACTUAL_TOKEN"
