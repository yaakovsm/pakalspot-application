# Production environment values
app:
  environment: production

# Frontend configuration for production
frontend:
  replicaCount: 2
  image:
    repository: nginxinc/nginx-unprivileged
    tag: "v1.27.2"  # Use versioned tag for prebuilt static assets
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Backend configuration for production
backend:
  replicaCount: 3
  image:
    repository: ghcr.io/yaakovsm/pakalspot-backend
    tag: "v1.0.0-abc1234"  # Use specific version tags in production
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  env:
    DEBUG: "false"
    ENVIRONMENT: "production"

# Database configuration for production
database:
  statefulSet:
    replicaCount: 1  # Keep at 1 for PostgreSQL
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi
  persistence:
    size: 50Gi
    storageClass: "fast-ssd"  # Use fast storage in production

# Ingress configuration for production
ingress:
  enabled: true
  hosts:
    - host: pakalspot.com
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend
  tls:
    - secretName: pakalspot-tls
      hosts:
        - pakalspot.com

# Security enhancements for production
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

# Autoscaling for production
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
