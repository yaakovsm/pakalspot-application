services:
  db:
    image: postgis/postgis:15-3.3
    container_name: pakal-spot-db
    restart: unless-stopped
    env_file:
      - .env 
    environment:
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./Backend/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - pakalspot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./Backend:/app
    env_file:
      - .env 
      - ./Backend/.env
    environment:
      - DB_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pakalspot-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    env_file:
      - ./Frontend/.env
      - .env
    environment:
      VITE_API_BASE_URL: "${API_BASE_URL}"
    depends_on:
      - backend
    networks:
      - pakalspot-network

networks:
  pakalspot-network:
    driver: bridge

volumes:
  db_data:
