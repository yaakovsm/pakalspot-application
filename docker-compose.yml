services:
  db:
    image: postgis/postgis:15-3.3
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./Backend/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - pakalspot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app
    environment:
      - DB_URL=postgresql://pakalspot_user:pakalspot_password@db:5432/pakalspot_db
      - SECRET_KEY=dev-secret-key-change-in-production-12345
      - JWT_EXPIRY=43200
      - API_PREFIX=/api
      - S3_BUCKET=pakalspot-photos
      - S3_ENDPOINT=https://s3.amazonaws.com
      - S3_ACCESS_KEY=AKIASU5665ZS2ORE6Q6B
      - S3_SECRET_KEY=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
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pakalspot-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
      - VITE_MAPLIBRE_ACCESS_TOKEN=pk.dev-token-for-development
      - VITE_APP_NAME=PakalSpot
      - VITE_APP_VERSION=1.0.0
    depends_on:
      - backend
    networks:
      - pakalspot-network

networks:
  pakalspot-network:
    driver: bridge

volumes:
  db_data: