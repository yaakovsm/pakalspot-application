name: Build, Test and Push PakalSpot Docker Images

on:
  push:
    branches: [dev, main, staging]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract short SHA
        id: vars
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV


      - name: Build services with docker compose
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          docker compose -f docker-compose.yml build
          docker tag pakalspot-backend ${DOCKER_USERNAME}/pakalspot-backend:dev-${{ env.SHORT_SHA }}
          docker tag pakalspot-backend ${DOCKER_USERNAME}/pakalspot-backend:dev-latest
          docker tag pakalspot-frontend ${DOCKER_USERNAME}/pakalspot-frontend:dev-${{ env.SHORT_SHA }}
          docker tag pakalspot-frontend ${DOCKER_USERNAME}/pakalspot-frontend:dev-latest

      - name: Run services with docker compose
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          docker compose -f docker-compose.yml up -d
          sleep 15

      - name: Wait for database to be ready
        run: |
          echo "Waiting for database to be ready..."
          timeout 60 bash -c 'until docker compose exec -T db pg_isready -U pakalspot_user -d pakalspot_db; do sleep 2; done'

      - name: Reset database state for clean migration
        run: |
          echo "Resetting database state..."
          docker compose exec -T db psql -U pakalspot_user -d pakalspot_db -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"

      - name: Run database migrations
        run: docker compose exec -T backend alembic upgrade head

      - name: Check backend is running
        run: |
          if [ "$(docker inspect -f '{{.State.Running}}' $(docker compose ps -q backend))" != "true" ]; then
            echo "Backend failed to start"
            docker compose logs backend
            exit 1
          fi

      - name: Check frontend is running
        run: |
          if [ "$(docker inspect -f '{{.State.Running}}' $(docker compose ps -q frontend))" != "true" ]; then
            echo "Frontend failed to start"
            docker compose logs frontend
            exit 1
          fi

      - name: Test backend HTTP response
        run: |
          echo "Testing backend endpoint..."
          curl --fail http://localhost:8000/docs || (echo "Backend did not respond properly" && exit 1)

      - name: Wait for frontend to be ready
        run: |
          echo "Waiting for frontend..."
          timeout 60 bash -c 'until curl -s http://localhost:3000 > /dev/null; do sleep 2; done'
        
      - name: Test frontend HTTP response
        run: |
          echo "Testing frontend endpoint..."
          curl --fail http://localhost:3000 || (echo "Frontend did not respond properly" && exit 1)

      - name: Shut down containers
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: docker compose -f docker-compose.yml down

      - name: Clean old DockerHub images (backend)
        env:
          IMAGE_NAME: pakalspot-backend
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "Cleaning old backend tags from DockerHub..."
          TOKEN=$(curl -s -H "Content-Type: application/json" -X POST -d '{"username": "'"$DOCKER_USERNAME"'", "password": "'"$DOCKER_PASSWORD"'"}' https://hub.docker.com/v2/users/login/ | jq -r .token)
          TAGS=$(curl -s -H "Authorization: JWT $TOKEN" "https://hub.docker.com/v2/repositories/$DOCKER_USERNAME/$IMAGE_NAME/tags/?page_size=100" | jq -r '.results | sort_by(.last_updated) | .[].name')
          COUNT=$(echo "$TAGS" | wc -l)
          KEEP=5
          echo "Found $COUNT backend tags"
          if [ "$COUNT" -gt "$KEEP" ]; then
            DELETE=$(echo "$TAGS" | head -n $(($COUNT - $KEEP)))
            for tag in $DELETE; do
              echo "Deleting backend tag: $tag"
              curl -s -X DELETE -H "Authorization: JWT $TOKEN" "https://hub.docker.com/v2/repositories/$DOCKER_USERNAME/$IMAGE_NAME/tags/$tag/"
            done
          else
            echo "No backend tags to delete"
          fi

      - name: Clean old DockerHub images (frontend)
        env:
          IMAGE_NAME: pakalspot-frontend
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "Cleaning old frontend tags from DockerHub..."
          TOKEN=$(curl -s -H "Content-Type: application/json" -X POST -d '{"username": "'"$DOCKER_USERNAME"'", "password": "'"$DOCKER_PASSWORD"'"}' https://hub.docker.com/v2/users/login/ | jq -r .token)
          TAGS=$(curl -s -H "Authorization: JWT $TOKEN" "https://hub.docker.com/v2/repositories/$DOCKER_USERNAME/$IMAGE_NAME/tags/?page_size=100" | jq -r '.results | sort_by(.last_updated) | .[].name')
          COUNT=$(echo "$TAGS" | wc -l)
          KEEP=5
          echo "Found $COUNT frontend tags"
          if [ "$COUNT" -gt "$KEEP" ]; then
            DELETE=$(echo "$TAGS" | head -n $(($COUNT - $KEEP)))
            for tag in $DELETE; do
              echo "Deleting frontend tag: $tag"
              curl -s -X DELETE -H "Authorization: JWT $TOKEN" "https://hub.docker.com/v2/repositories/$DOCKER_USERNAME/$IMAGE_NAME/tags/$tag/"
            done
          else
            echo "No frontend tags to delete"
          fi

      - name: Push images to DockerHub
        run: |
          docker push ${DOCKER_USERNAME}/pakalspot-backend:dev-${{ env.SHORT_SHA }}
          docker push ${DOCKER_USERNAME}/pakalspot-backend:dev-latest

          docker push ${DOCKER_USERNAME}/pakalspot-frontend:dev-${{ env.SHORT_SHA }}
          docker push ${DOCKER_USERNAME}/pakalspot-frontend:dev-latest

      - name: Save image digests
        run: |
          docker pull ${DOCKER_USERNAME}/pakalspot-backend:dev-${{ env.SHORT_SHA }}
          docker pull ${DOCKER_USERNAME}/pakalspot-frontend:dev-${{ env.SHORT_SHA }}

          docker inspect --format='{{index .RepoDigests 0}}' ${DOCKER_USERNAME}/pakalspot-backend:dev-${{ env.SHORT_SHA }} > digest-backend.txt
          docker inspect --format='{{index .RepoDigests 0}}' ${DOCKER_USERNAME}/pakalspot-frontend:dev-${{ env.SHORT_SHA }} > digest-frontend.txt

      - name: Create Kubernetes secrets
        if: ${{ secrets.KUBECONFIG != '' }}
        run: |
          # Create secrets for the cluster
          kubectl create secret generic pakalspot-secrets \
            --from-literal=MAPS_API_KEY="${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}" \
            --from-literal=S3_ACCESS_KEY="${{ secrets.S3_ACCESS_KEY }}" \
            --from-literal=S3_SECRET_KEY="${{ secrets.S3_SECRET_KEY }}" \
            --from-literal=SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            --from-literal=DB_URL="postgresql://pakalspot_user:jcoffeebrew@pakalspot-pakalspot-chart-postgres:5432/pakalspot_db" \
            --dry-run=client -o yaml | kubectl apply -f -
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}

      - name: Upload digest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: image-digests
          path: |
            digest-backend.txt
            digest-frontend.txt
