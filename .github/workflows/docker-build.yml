name: Build, Push to ECR and Update GitOps

on:
  push:
    branches: [dev, staging, main, k8sfinal]
    paths:
      - 'pakalspot-app/Backend/**'
      - 'pakalspot-app/Frontend/**'
      - '.github/workflows/**'

env:
  AWS_REGION: us-east-1
  BACKEND_REPO: pakalspot-backend
  FRONTEND_REPO: pakalspot-frontend
  GITOPS_REPO: yaakovsm/pakalspot-gitops

jobs:
  # ----------------------------------------------------------
  # 1) Build & Push to ECR
  # ----------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      TAG: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate tag
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="${GITHUB_REF_NAME}-${SHORT_SHA}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using image tag: $TAG"

      - name: Configure AWS credentials (Access Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend image
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          echo "Building backend image..."
          docker build -t $REGISTRY/$BACKEND_REPO:$TAG ./pakalspot-app/Backend

          echo "Pushing backend image..."
          docker push $REGISTRY/$BACKEND_REPO:$TAG

      - name: Build & push frontend image
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          echo "Building frontend image..."
          docker build -t $REGISTRY/$FRONTEND_REPO:$TAG ./pakalspot-app/Frontend

          echo "Pushing frontend image..."
          docker push $REGISTRY/$FRONTEND_REPO:$TAG

  # ----------------------------------------------------------
  # 2) Update GitOps repo (ArgoCD will sync)
  # ----------------------------------------------------------
  update-gitops:
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      TAG: ${{ needs.build-and-push.outputs.TAG }}

    steps:
      - name: Setup SSH for GitHub
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GITOPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone GitOps repo
        run: |
          git clone git@github.com:${{ env.GITOPS_REPO }}.git
          cd pakalspot-gitops
          git status

      - name: Install yq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y yq

      - name: Detect environment
        id: env
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF_NAME}" == "staging" ]]; then
            echo "env=staging" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF_NAME}" == "k8sfinal" ]]; then
            echo "env=k8sfinal" >> $GITHUB_OUTPUT
          else
            echo "env=dev" >> $GITHUB_OUTPUT
          fi

      - name: Update values.yaml in GitOps repo
        run: |
          cd pakalspot-gitops
          ENV_NAME=${{ steps.env.outputs.env }}

          echo "Updating environment: $ENV_NAME with TAG: $TAG"

          cd environments/$ENV_NAME

          yq -iy ".backend.image.tag = \"$TAG\"" values.yaml
          yq -iy ".frontend.image.tag = \"$TAG\"" values.yaml

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git add values.yaml
          git commit -m "[$ENV_NAME] Update images to $TAG" || echo "No changes to commit"
          git push origin main
