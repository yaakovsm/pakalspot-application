name: Build, Test and Push to ECR

on:
  push:
    branches: [dev, staging, main]
    paths:
      - 'pakalspot-app/Backend/**'
      - 'pakalspot-app/Frontend/**'

env:
  AWS_REGION: us-east-1
  BACKEND_REPO: pakalspot-backend
  FRONTEND_REPO: pakalspot-frontend

jobs:
  # ----------------------------------------------------------
  # 1) Build + Test
  # ----------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    outputs:
      TAG: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate tag
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="${GITHUB_REF_NAME}-${SHORT_SHA}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build backend
        run: |
          docker build -t backend:${{ steps.meta.outputs.tag }} ./pakalspot-app/backend

      - name: Build frontend
        run: |
          docker build -t frontend:${{ steps.meta.outputs.tag }} ./pakalspot-app/frontend

      - name: Basic smoke tests
        run: |
          echo "Tests passed (placeholder)."

  # ----------------------------------------------------------
  # 2) Push Images to ECR
  # ----------------------------------------------------------
  push:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    outputs:
      TAG: ${{ needs.build.outputs.TAG }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push images
        env:
          TAG: ${{ needs.build.outputs.TAG }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker tag backend:$TAG $REGISTRY/$BACKEND_REPO:$TAG
          docker tag frontend:$TAG $REGISTRY/$FRONTEND_REPO:$TAG

          docker push $REGISTRY/$BACKEND_REPO:$TAG
          docker push $REGISTRY/$FRONTEND_REPO:$TAG


  # ----------------------------------------------------------
  # 3) Update GitOps Repository
  # ----------------------------------------------------------
  update-gitops:
    runs-on: ubuntu-latest
    needs: push
    env:
      TAG: ${{ needs.push.outputs.TAG }}
      GITOPS_REPO: yaakovsm/pakalspot-gitops

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Install yq
        run: sudo apt-get install -y yq

      - name: Detect env
        id: env
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then echo "env=prod" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF_NAME}" == "staging" ]]; then echo "env=staging" >> $GITHUB_OUTPUT
          else echo "env=dev" >> $GITHUB_OUTPUT
          fi

      - name: Update values.yaml
        run: |
          cd environments/${{ steps.env.outputs.env }}
          yq -iy ".backend.image.tag=\"$TAG\"" values.yaml
          yq -iy ".frontend.image.tag=\"$TAG\"" values.yaml

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git add values.yaml
          git commit -m "Update images to $TAG" || true
          git push