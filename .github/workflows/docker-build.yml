name: Build, Test and Sync PakalSpot

on:
  push:
    branches: [dev, staging, main]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  # ----------------------------------------------------------
  # 1️ Build and Push Docker Images
  # ----------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    outputs:
      IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
      SHORT_SHA: ${{ steps.meta.outputs.short_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate image metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE_TAG="${GITHUB_REF_NAME}-${SHORT_SHA}"
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Using tag: $IMAGE_TAG"

      - name: Build and push Docker images
        working-directory: pakalspot-app
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          echo "Building Docker images..."
          docker compose build \
            --build-arg GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY \
            --build-arg S3_ACCESS_KEY=$S3_ACCESS_KEY \
            --build-arg S3_SECRET_KEY=$S3_SECRET_KEY \
            --build-arg SECRET_KEY=$SECRET_KEY \
            --progress=plain

          echo "Tagging images..."
          docker tag pakalspot-app-backend ${DOCKER_USERNAME}/pakalspot-backend:${{ steps.meta.outputs.image_tag }}
          docker tag pakalspot-app-frontend ${DOCKER_USERNAME}/pakalspot-frontend:${{ steps.meta.outputs.image_tag }}

          echo "Pushing images..."
          docker push ${DOCKER_USERNAME}/pakalspot-backend:${{ steps.meta.outputs.image_tag }}
          docker push ${DOCKER_USERNAME}/pakalspot-frontend:${{ steps.meta.outputs.image_tag }}

  # ----------------------------------------------------------
  # 2️ Integration Tests
  # ----------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull built images
        run: |
          docker pull ${DOCKER_USERNAME}/pakalspot-backend:${{ needs.build.outputs.IMAGE_TAG }}
          docker pull ${DOCKER_USERNAME}/pakalspot-frontend:${{ needs.build.outputs.IMAGE_TAG }}

      - name: Run containers for smoke tests
        working-directory: pakalspot-app
        run: |
          docker compose up -d
          echo "Waiting for services..."
          timeout 60 bash -c 'until curl -s http://localhost:8000/docs; do sleep 3; done'
          timeout 60 bash -c 'until curl -s http://localhost:3000; do sleep 3; done'
          echo "Services are up and running."
          docker compose down

  # ----------------------------------------------------------
  # 3️ Update GitOps Repository (ArgoCD will deploy)
  # ----------------------------------------------------------
  update-gitops:
    runs-on: ubuntu-latest
    needs: [build, test]
    env:
      GITOPS_REPO: yaakovsm/pakalspot-gitops
      GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}  
      IMAGE_TAG: ${{ needs.build.outputs.IMAGE_TAG }}
      GITOPS_BRANCH: main

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y yq git

      - name: Determine environment
        id: env
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            DEPLOY_ENV="prod"
          elif [[ "${GITHUB_REF_NAME}" == "staging" ]]; then
            DEPLOY_ENV="staging"
          else
            DEPLOY_ENV="dev"
          fi
          echo "deploy_env=$DEPLOY_ENV" >> $GITHUB_OUTPUT

      - name: Clone and update GitOps repo
        run: |
          DEPLOY_ENV=${{ steps.env.outputs.deploy_env }}
          echo "Cloning GitOps repo (branch: $GITOPS_BRANCH)..."
          git clone https://github.com/${GITOPS_REPO}
          cd pakalspot-gitops
          git checkout $GITOPS_BRANCH
          cd environments/$DEPLOY_ENV

          echo "Updating $DEPLOY_ENV values.yaml with tag $IMAGE_TAG..."
          yq -iy ".frontend.image.tag = \"$IMAGE_TAG\"" values.yaml
          yq -iy ".backend.image.tag = \"$IMAGE_TAG\"" values.yaml

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git config credential.helper 'cache --timeout=120'
          echo "https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com" | git credential approve

          git add values.yaml
          git commit -m "[$DEPLOY_ENV] Update image tag to $IMAGE_TAG [skip ci]" || echo "No changes to commit"
          git push https://github.com/${GITOPS_REPO}.git HEAD:$GITOPS_BRANCH

          echo "GitOps repo updated successfully for $DEPLOY_ENV with tag $IMAGE_TAG"