name: Build, Test, and Deploy PakalSpot

on:
  push:
    branches: [dev, staging, main]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  # ----------------------------------------------------------
  # 1️ Build and Push Docker Images
  # ----------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and Push images (cached)
        working-directory: pakalspot-app
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          docker compose build \
            --build-arg GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY \
            --build-arg S3_ACCESS_KEY=$S3_ACCESS_KEY \
            --build-arg S3_SECRET_KEY=$S3_SECRET_KEY \
            --build-arg SECRET_KEY=$SECRET_KEY \
            --progress=plain
          
          docker tag pakalspot-app-backend ${DOCKER_USERNAME}/pakalspot-backend:${GITHUB_REF_NAME}-${{ env.SHORT_SHA }}
          docker tag pakalspot-app-frontend ${DOCKER_USERNAME}/pakalspot-frontend:${GITHUB_REF_NAME}-${{ env.SHORT_SHA }}

          docker push ${DOCKER_USERNAME}/pakalspot-backend:${GITHUB_REF_NAME}-${{ env.SHORT_SHA }}
          docker push ${DOCKER_USERNAME}/pakalspot-frontend:${GITHUB_REF_NAME}-${{ env.SHORT_SHA }}

      - name: Export image tags
        run: |
          echo "IMAGE_TAG=${GITHUB_REF_NAME}-${{ env.SHORT_SHA }}" >> $GITHUB_ENV
          echo "Backend: ${DOCKER_USERNAME}/pakalspot-backend:$IMAGE_TAG"
          echo "Frontend: ${DOCKER_USERNAME}/pakalspot-frontend:$IMAGE_TAG"


  # ----------------------------------------------------------
  # 2️ Integration Tests
  # ----------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        uses: docker/setup-buildx-action@v3

      - name: Pull images from DockerHub
        run: |
          docker pull ${DOCKER_USERNAME}/pakalspot-backend:${GITHUB_REF_NAME}-${{ needs.build.outputs.SHORT_SHA }}
          docker pull ${DOCKER_USERNAME}/pakalspot-frontend:${GITHUB_REF_NAME}-${{ needs.build.outputs.SHORT_SHA }}

      - name: Run containers
        working-directory: pakalspot-app
        run: |
          docker compose up -d
          sleep 20
          docker compose ps

      - name: Run integration tests
        run: |
          echo "Checking backend endpoint..."
          curl --fail http://localhost:8000/docs || (docker compose logs backend && exit 1)
          echo "Checking frontend endpoint..."
          curl --fail http://localhost:3000 || (docker compose logs frontend && exit 1)

      - name: Tear down
        working-directory: pakalspot-app
        run: docker compose down


  # ----------------------------------------------------------
  # 3️ Update GitOps Repository
  # ----------------------------------------------------------
  update-gitops:
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Install yq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y yq git

      - name: Update image tag in GitOps repo
        env:
          GITOPS_REPO: yaakovsm/pakalspot-gitops
          IMAGE_TAG: ${{ github.ref_name }}-${{ env.SHORT_SHA }}
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            GITOPS_BRANCH="main"
          elif [[ "${GITHUB_REF_NAME}" == "staging" ]]; then
            GITOPS_BRANCH="staging"
          else
            GITOPS_BRANCH="dev"
          fi

          git clone https://$GITHUB_TOKEN@github.com/$GITOPS_REPO.git
          cd pakalspot-gitops/environments/$GITOPS_BRANCH

          yq -i ".frontend.image.tag = \"$IMAGE_TAG\"" values.yaml
          yq -i ".backend.image.tag = \"$IMAGE_TAG\"" values.yaml

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add values.yaml
          git commit -m "Update image tag to $IMAGE_TAG [skip ci]" || echo "No changes to commit"
          git push origin $GITOPS_BRANCH
