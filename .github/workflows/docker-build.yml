name: Build, Test and Sync PakalSpot

on:
  push:
    branches: [dev, staging, main]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  # ----------------------------------------------------------
  # 1. Build Docker Images
  # ----------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    outputs:
      IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
      SHORT_SHA: ${{ steps.meta.outputs.short_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE_TAG="${GITHUB_REF_NAME}-${SHORT_SHA}"
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Using tag: $IMAGE_TAG"

      - name: Build Docker images
        working-directory: pakalspot-app
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          echo "Building Docker images..."
          echo "Using VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY:0:6}*****"

          # Ensure env vars are visible to Docker Compose
          export VITE_GOOGLE_MAPS_API_KEY S3_ACCESS_KEY S3_SECRET_KEY SECRET_KEY

          # Build images with explicit build args
          docker compose build \
            --build-arg VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY} \
            --build-arg S3_ACCESS_KEY=${S3_ACCESS_KEY} \
            --build-arg S3_SECRET_KEY=${S3_SECRET_KEY} \
            --build-arg SECRET_KEY=${SECRET_KEY} \
            --no-cache --progress=plain

      - name: Save Docker images as artifacts
        working-directory: pakalspot-app
        run: |
          echo "Saving Docker images..."
          docker save pakalspot-app-backend -o pakalspot-backend.tar
          docker save pakalspot-app-frontend -o pakalspot-frontend.tar

      - name: Delete artifacts older than 3 days
        uses: actions/github-script@v7
        with:
          script: |
            const threeDaysAgo = new Date();
            threeDaysAgo.setDate(threeDaysAgo.getDate() - 3);
            
            console.log(`Deleting artifacts older than ${threeDaysAgo.toISOString()}...`);
            
            let deletedCount = 0;
            let page = 1;
            const perPage = 100;
            
            while (true) {
              const { data: response } = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: perPage,
                page: page
              });
              
              if (response.artifacts.length === 0) {
                break;
              }
              
              for (const artifact of response.artifacts) {
                const createdAt = new Date(artifact.created_at);
                if (createdAt < threeDaysAgo) {
                  console.log(`Deleting artifact: ${artifact.name} (created: ${artifact.created_at})`);
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id
                  });
                  deletedCount++;
                }
              }
              
              if (response.artifacts.length < perPage) {
                break;
              }
              
              page++;
            }
            
            console.log(`Deleted ${deletedCount} artifact(s) older than 3 days.`);

      - name: Upload image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            pakalspot-app/pakalspot-backend.tar
            pakalspot-app/pakalspot-frontend.tar
          retention-days: 1
          compression-level: 6

  # ----------------------------------------------------------
  # 2. Integration Tests
  # ----------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download image artifacts
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: pakalspot-app/

      - name: Load Docker images
        working-directory: pakalspot-app
        run: |
          echo "Loading Docker images..."
          docker load -i pakalspot-backend.tar
          docker load -i pakalspot-frontend.tar

      - name: Run containers for smoke tests
        working-directory: pakalspot-app
        run: |
          docker compose up -d
          echo "Waiting for services..."
          timeout 60 bash -c 'until curl -s http://localhost:8000/docs; do sleep 3; done'
          timeout 60 bash -c 'until curl -s http://localhost:3000; do sleep 3; done'
          echo "Services are up and running."
          docker compose down

  # ----------------------------------------------------------
  # 3. Push Docker Images to DockerHub
  # ----------------------------------------------------------
  push:
    runs-on: ubuntu-latest
    needs: [build, test]
    outputs:
      IMAGE_TAG: ${{ needs.build.outputs.IMAGE_TAG }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Download image artifacts
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: pakalspot-app/

      - name: Load Docker images
        working-directory: pakalspot-app
        run: |
          echo "Loading Docker images..."
          docker load -i pakalspot-backend.tar
          docker load -i pakalspot-frontend.tar

      - name: Tag and push Docker images
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ needs.build.outputs.IMAGE_TAG }}
        run: |
          echo "Tagging and pushing images with tag: $IMAGE_TAG"
          docker tag pakalspot-app-backend ${DOCKER_USERNAME}/pakalspot-backend:${IMAGE_TAG}
          docker tag pakalspot-app-frontend ${DOCKER_USERNAME}/pakalspot-frontend:${IMAGE_TAG}

          docker push ${DOCKER_USERNAME}/pakalspot-backend:${IMAGE_TAG}
          docker push ${DOCKER_USERNAME}/pakalspot-frontend:${IMAGE_TAG}
          echo "Successfully pushed images to DockerHub"

  # ----------------------------------------------------------
  # 4. Update GitOps Repository (ArgoCD will deploy)
  # ----------------------------------------------------------
  update-gitops:
    runs-on: ubuntu-latest
    needs: [build, test, push]
    env:
      GITOPS_REPO: yaakovsm/pakalspot-gitops
      IMAGE_TAG: ${{ needs.push.outputs.IMAGE_TAG }}
      GITOPS_BRANCH: main

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y yq git openssh-client

      - name: Setup SSH for GitHub
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GITOPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Determine environment
        id: env
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            DEPLOY_ENV="prod"
          elif [[ "${GITHUB_REF_NAME}" == "staging" ]]; then
            DEPLOY_ENV="staging"
          else
            DEPLOY_ENV="dev"
          fi
          echo "deploy_env=$DEPLOY_ENV" >> $GITHUB_OUTPUT

      - name: Clone and update GitOps repo (via SSH)
        run: |
          DEPLOY_ENV=${{ steps.env.outputs.deploy_env }}
          echo "Cloning GitOps repo (branch: $GITOPS_BRANCH)..."
          git clone git@github.com:${GITOPS_REPO}.git
          cd pakalspot-gitops
          git checkout $GITOPS_BRANCH
          cd environments/$DEPLOY_ENV

          echo "Updating $DEPLOY_ENV values.yaml with tag $IMAGE_TAG..."
          yq -iy ".frontend.image.tag = \"$IMAGE_TAG\"" values.yaml
          yq -iy ".backend.image.tag = \"$IMAGE_TAG\"" values.yaml

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add values.yaml
          git commit -m "[$DEPLOY_ENV] Update image tag to $IMAGE_TAG [skip ci]" || echo "No changes to commit"
          git push origin $GITOPS_BRANCH

          echo "GitOps repo updated successfully for $DEPLOY_ENV with tag $IMAGE_TAG"
